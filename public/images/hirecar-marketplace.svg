<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0.5" y1="0.4" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#141c2c" stop-opacity="0" />
      <stop offset="60%" stop-color="#1a2436" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0e1522" />
    </linearGradient>
    <linearGradient id="carBodyGrad" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="25%" stop-color="#1a202c" />
      <stop offset="60%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="carGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0" />
      <stop offset="50%" stop-color="#ff3333" stop-opacity="1" />
      <stop offset="100%" stop-color="#ff5533" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="orangeBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="blurLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Road / Highway Perspective -->
  <path d="M 450 320 L 750 320 L 1200 675 L 200 675 Z" fill="url(#roadGrad)" />
  <line x1="600" y1="340" x2="680" y2="675" stroke="#f59e0b" stroke-width="4" stroke-dasharray="25,25" stroke-opacity="0.6" />

  <!-- Sleek Luxury Sports Car Silhouette (Right Half) -->
  <g transform="translate(480, 160)">
    <!-- Car Motion blur/glow -->
    <ellipse cx="420" cy="360" rx="260" ry="25" fill="#000000" opacity="0.6" />
    <!-- Rear fender and cabin -->
    <path d="M 120 280 C 180 180, 280 120, 440 100 C 560 90, 680 130, 720 220 C 740 260, 720 330, 680 340 C 600 350, 200 350, 120 280 Z" fill="url(#carBodyGrad)" />
    <!-- Roof line & windows -->
    <path d="M 280 145 C 360 115, 460 110, 560 125 C 590 145, 590 200, 560 210 C 450 210, 320 210, 280 145 Z" fill="#05080e" opacity="0.9" />
    <path d="M 330 140 C 400 125, 480 120, 540 135 L 530 195 L 340 195 Z" fill="#1e293b" opacity="0.4" />
    <!-- Rear light bar glow -->
    <path d="M 170 245 C 230 238, 300 238, 380 246" stroke="#ff2222" stroke-width="12" stroke-linecap="round" filter="url(#blurLight)" />
    <path d="M 170 245 C 230 238, 300 238, 380 246" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <!-- Wheels -->
    <ellipse cx="610" cy="320" rx="55" ry="55" fill="#0f172a" stroke="#475569" stroke-width="6" />
    <ellipse cx="610" cy="320" rx="35" ry="35" fill="#1e293b" stroke="#64748b" stroke-width="3" />
    <ellipse cx="230" cy="310" rx="48" ry="48" fill="#0f172a" stroke="#475569" stroke-width="6" />
  </g>

  <!-- Dark overlay to ensure crisp readability on left side -->
  <rect x="0" y="0" width="700" height="675" fill="url(#bgGrad)" opacity="0.94" />

  <!-- Top Navigation Bar -->
  <rect x="0" y="0" width="1200" height="64" fill="#ffffff" />
  
  <!-- HireCar Logo on Nav -->
  <g transform="translate(36, 14)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#f97316" />
    <path d="M 8 24 C 8 20, 12 14, 18 14 C 24 14, 28 20, 28 24 Z" fill="#ffffff" />
    <circle cx="12" cy="24" r="3" fill="#ea580c" />
    <circle cx="24" cy="24" r="3" fill="#ea580c" />
    <text x="46" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" fill="#0f172a">HireCar</text>
    <text x="114" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#f97316" letter-spacing="1.5">MARKETPLACE</text>
    <text x="46" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#64748b">Premium car rental. Without the premium price.</text>
  </g>

  <!-- Navigation Menu Links -->
  <g transform="translate(560, 36)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#334155">
    <text x="0" y="0">Locations ▾</text>
    <text x="100" y="0">Vehicles ▾</text>
    <text x="195" y="0">Pricing</text>
    <text x="270" y="0">Vendors</text>
    <text x="350" y="0">About</text>
    <text x="415" y="0">Blog</text>
    <text x="470" y="0">Contact</text>
  </g>

  <!-- Left Main Hero Showcase Content -->
  <g transform="translate(60, 150)">
    <!-- Heading -->
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Premium Car Rental
    </text>
    <text x="0" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      <tspan fill="#ffffff">Australia, </tspan>
      <tspan fill="#f97316">direct from</tspan>
    </text>
    <text x="0" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" fill="#f97316" letter-spacing="-1">
      trusted operators.
    </text>

    <!-- Subtitle -->
    <text x="0" y="235" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" width="560">
      <tspan x="0" dy="0">Compare cars, vans, utes and luxury vehicles from verified Australian</tspan>
      <tspan x="0" dy="24">rental businesses. No marketplace fees, ever.</tspan>
    </text>

    <!-- CTA Buttons -->
    <g transform="translate(0, 305)">
      <!-- Search Vehicles -->
      <rect x="0" y="0" width="180" height="48" rx="24" fill="url(#orangeBtn)" />
      <!-- Magnifying Glass icon -->
      <circle cx="28" cy="24" r="6" stroke="#ffffff" stroke-width="2.5" fill="none" />
      <line x1="32" y1="28" x2="38" y2="34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="50" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Search Vehicles</text>

      <!-- List Your Fleet Free -->
      <rect x="195" y="0" width="200" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <text x="220" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">List Your Fleet Free</text>
      <path d="M 365 24 L 375 24 M 371 20 L 375 24 L 371 28" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Trust Badges -->
    <g transform="translate(0, 395)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">
      <!-- Badge 1 -->
      <circle cx="10" cy="10" r="9" fill="none" stroke="#22c55e" stroke-width="2" />
      <path d="M 6 10 L 9 13 L 14 7" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="26" y="14">Verified businesses</text>

      <!-- Badge 2 -->
      <circle cx="190" cy="10" r="9" fill="none" stroke="#22c55e" stroke-width="2" />
      <path d="M 186 10 L 189 13 L 194 7" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="206" y="14">No hidden fees</text>

      <!-- Badge 3 -->
      <circle cx="350" cy="10" r="9" fill="none" stroke="#22c55e" stroke-width="2" />
      <path d="M 346 10 L 349 13 L 354 7" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="366" y="14">Australia-wide</text>
    </g>
  </g>
</svg>
