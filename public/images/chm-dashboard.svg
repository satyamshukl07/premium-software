<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="chmCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c0f0" />
      <stop offset="100%" stop-color="#0096c7" />
    </linearGradient>
    <linearGradient id="chmPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#b5179e" />
    </linearGradient>
    <linearGradient id="chmOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f77f00" />
      <stop offset="100%" stop-color="#fca311" />
    </linearGradient>
    <linearGradient id="chmPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#560bad" />
    </linearGradient>
    <linearGradient id="chmRed1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>
    <linearGradient id="chmRed2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef233c" />
      <stop offset="100%" stop-color="#c1121f" />
    </linearGradient>
    <linearGradient id="chmBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="chmGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background for app workspace -->
  <rect width="1200" height="675" fill="#f1f5f9" />

  <!-- Left Sidebar (Width 220) -->
  <rect x="0" y="0" width="220" height="675" fill="#111827" />

  <!-- Logo CHM in Sidebar -->
  <g transform="translate(20, 24)">
    <!-- Connected polygon icon -->
    <path d="M 12 10 L 28 6 L 36 20 L 24 30 L 10 24 Z" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle cx="12" cy="10" r="3" fill="#38bdf8" />
    <circle cx="28" cy="6" r="3" fill="#38bdf8" />
    <circle cx="36" cy="20" r="3" fill="#38bdf8" />
    <circle cx="24" cy="30" r="3" fill="#38bdf8" />
    <circle cx="10" cy="24" r="3" fill="#38bdf8" />
    <line x1="12" y1="10" x2="24" y2="30" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Text -->
    <text x="46" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1">CHM</text>
    <text x="46" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#94a3b8">Smart Car Hire Management</text>
  </g>

  <!-- Sidebar Nav Menu Items -->
  <g transform="translate(0, 90)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
    <!-- Active Dashboard Item -->
    <rect x="0" y="0" width="220" height="42" fill="#1f2937" />
    <path d="M 0 0 L 4 0 L 4 42 L 0 42 Z" fill="#38bdf8" />
    <!-- Home icon -->
    <path d="M 24 23 L 30 17 L 36 23 M 26 22 L 26 27 L 34 27 L 34 22" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="46" y="26" fill="#ffffff" font-weight="700">Dashboard</text>

    <!-- Fleet Status -->
    <g transform="translate(0, 44)" fill="#94a3b8">
      <path d="M 23 25 C 23 21, 26 19, 30 19 C 34 19, 37 21, 37 25" fill="none" stroke="#94a3b8" stroke-width="1.8" />
      <circle cx="26" cy="25" r="2" fill="#94a3b8" />
      <circle cx="34" cy="25" r="2" fill="#94a3b8" />
      <text x="46" y="24">Fleet Status</text>
    </g>

    <!-- Bookings -->
    <g transform="translate(0, 84)" fill="#94a3b8">
      <rect x="23" y="14" width="14" height="13" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.8" />
      <line x1="23" y1="18" x2="37" y2="18" stroke="#94a3b8" stroke-width="1.8" />
      <text x="46" y="24">Bookings</text>
    </g>

    <!-- Recurring Booking -->
    <g transform="translate(0, 124)" fill="#94a3b8">
      <path d="M 24 20 A 5 5 0 1 1 29 25" fill="none" stroke="#94a3b8" stroke-width="1.8" />
      <text x="46" y="24">Recurring Booking</text>
    </g>

    <!-- Calendar -->
    <g transform="translate(0, 164)" fill="#94a3b8">
      <rect x="23" y="14" width="14" height="13" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.8" />
      <text x="46" y="24">Calendar</text>
    </g>

    <!-- Customers -->
    <g transform="translate(0, 204)" fill="#94a3b8">
      <circle cx="28" cy="18" r="3" fill="none" stroke="#94a3b8" stroke-width="1.8" />
      <path d="M 24 26 C 24 23, 26 22, 28 22 C 30 22, 32 23, 32 26" fill="none" stroke="#94a3b8" stroke-width="1.8" />
      <text x="46" y="24">Customers</text>
    </g>

    <!-- Financials > -->
    <g transform="translate(0, 244)" fill="#94a3b8">
      <circle cx="28" cy="20" r="6" fill="none" stroke="#94a3b8" stroke-width="1.8" />
      <text x="26" y="23" font-size="10" font-weight="700">$</text>
      <text x="46" y="24">Financials</text>
      <path d="M 195 17 L 199 20 L 195 23" fill="none" stroke="#64748b" stroke-width="1.8" />
    </g>

    <!-- Driver Management -->
    <g transform="translate(0, 284)" fill="#94a3b8">
      <circle cx="28" cy="20" r="6" fill="none" stroke="#94a3b8" stroke-width="1.8" />
      <text x="46" y="24">Driver Management</text>
    </g>

    <!-- Toll Management -->
    <g transform="translate(0, 324)" fill="#94a3b8">
      <rect x="23" y="16" width="14" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.8" />
      <text x="46" y="24">Toll Management</text>
    </g>

    <!-- Maintenance > -->
    <g transform="translate(0, 364)" fill="#94a3b8">
      <path d="M 24 16 L 32 24 M 32 16 L 24 24" stroke="#94a3b8" stroke-width="1.8" />
      <text x="46" y="24">Maintenance</text>
      <path d="M 195 17 L 199 20 L 195 23" fill="none" stroke="#64748b" stroke-width="1.8" />
    </g>

    <!-- Analytics -->
    <g transform="translate(0, 404)" fill="#94a3b8">
      <line x1="25" y1="26" x2="25" y2="20" stroke="#94a3b8" stroke-width="2" />
      <line x1="29" y1="26" x2="29" y2="15" stroke="#94a3b8" stroke-width="2" />
      <line x1="33" y1="26" x2="33" y2="22" stroke="#94a3b8" stroke-width="2" />
      <text x="46" y="24">Analytics</text>
    </g>
  </g>

  <!-- Top Header Bar (X: 220 to 1200) -->
  <rect x="220" y="0" width="980" height="64" fill="#ffffff" />
  <line x1="220" y1="64" x2="1200" y2="64" stroke="#e2e8f0" stroke-width="1" />

  <!-- Top Header Controls (Moon icon, Fullscreen icon, Avatar) -->
  <g transform="translate(1050, 18)">
    <!-- Moon icon -->
    <path d="M 12 6 A 8 8 0 1 0 20 18 A 9 9 0 0 1 12 6 Z" fill="none" stroke="#475569" stroke-width="1.8" />
    <!-- Expand icon -->
    <g transform="translate(36, 0)">
      <path d="M 6 10 L 6 6 L 10 6 M 20 6 L 24 6 L 24 10 M 24 18 L 24 22 L 20 22 M 6 18 L 6 22 L 10 22" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" />
    </g>
    <!-- User Avatar -->
    <g transform="translate(76, -3)">
      <circle cx="16" cy="16" r="16" fill="#3b82f6" />
      <circle cx="16" cy="12" r="6" fill="#bfdbfe" />
      <path d="M 8 28 C 8 22, 12 20, 16 20 C 20 20, 24 22, 24 28 Z" fill="#bfdbfe" />
    </g>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(244, 84)">
    <!-- Top Row: Title + Date Filter & Sync -->
    <text x="0" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0f172a">Dashboard</text>

    <!-- Date selector & Sync Button -->
    <g transform="translate(640, 4)">
      <!-- Date input -->
      <rect x="0" y="0" width="220" height="38" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="14" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#334155">10 Sept 2026</text>
      <!-- Calendar icon -->
      <rect x="186" y="10" width="18" height="18" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="186" y1="15" x2="204" y2="15" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Refresh Blue button -->
      <rect x="232" y="0" width="38" height="38" rx="6" fill="#2563eb" />
      <path d="M 246 16 A 5 5 0 1 1 251 22 M 251 16 L 251 20 L 247 20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- 8 Vibrant Dashboard Metric Cards Grid (Row 1 & Row 2 & Row 3) -->

    <!-- ROW 1 -->
    <!-- Card 1: Fleets (Cyan) -->
    <g transform="translate(0, 60)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="290" height="165" rx="16" fill="url(#chmCyan)" />
      <!-- Car Icon -->
      <g transform="translate(24, 26)" stroke="#ffffff" stroke-width="2" fill="none">
        <path d="M 4 16 C 4 12, 7 8, 14 8 L 22 8 C 29 8, 32 12, 32 16" />
        <rect x="2" y="16" width="32" height="10" rx="3" />
        <circle cx="8" cy="26" r="3" fill="#ffffff" />
        <circle cx="28" cy="26" r="3" fill="#ffffff" />
      </g>
      <text x="68" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Fleets</text>
      <text x="24" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">2</text>
    </g>

    <!-- Card 2: Customers (Pink/Magenta) -->
    <g transform="translate(315, 60)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="290" height="165" rx="16" fill="url(#chmPink)" />
      <!-- Person Icon -->
      <g transform="translate(24, 26)" stroke="#ffffff" stroke-width="2" fill="none">
        <circle cx="12" cy="8" r="5" />
        <path d="M 3 24 C 3 18, 7 16, 12 16 C 17 16, 21 18, 21 24" />
      </g>
      <text x="68" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Customers</text>
      <text x="24" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">1</text>
    </g>

    <!-- Card 3: Active Rentals (Orange/Amber) -->
    <g transform="translate(630, 60)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="290" height="165" rx="16" fill="url(#chmOrange)" />
      <!-- Calendar Icon -->
      <g transform="translate(24, 26)" stroke="#ffffff" stroke-width="2" fill="none">
        <rect x="2" y="4" width="24" height="22" rx="3" />
        <line x1="2" y1="10" x2="26" y2="10" />
      </g>
      <text x="68" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Active Rentals</text>
      <text x="24" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">1</text>
    </g>

    <!-- ROW 2 -->
    <!-- Card 4: Available Vehicles (Purple) -->
    <g transform="translate(0, 245)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="290" height="165" rx="16" fill="url(#chmPurple)" />
      <!-- Car Icon -->
      <g transform="translate(24, 26)" stroke="#ffffff" stroke-width="2" fill="none">
        <path d="M 4 16 C 4 12, 7 8, 14 8 L 22 8 C 29 8, 32 12, 32 16" />
        <rect x="2" y="16" width="32" height="10" rx="3" />
        <circle cx="8" cy="26" r="3" fill="#ffffff" />
        <circle cx="28" cy="26" r="3" fill="#ffffff" />
      </g>
      <text x="68" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Available Vehicles</text>
      <text x="24" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">1</text>
    </g>

    <!-- Card 5: Accidental (Crimson Red) -->
    <g transform="translate(315, 245)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="290" height="165" rx="16" fill="url(#chmRed1)" />
      <!-- Exclamation Icon -->
      <circle cx="36" cy="36" r="14" fill="none" stroke="#ffffff" stroke-width="2.5" />
      <line x1="36" y1="28" x2="36" y2="38" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <circle cx="36" cy="43" r="1.5" fill="#ffffff" />
      <text x="68" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Accidental</text>
      <text x="24" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">0</text>
    </g>

    <!-- Card 6: On Maintenance (Red Wrench) -->
    <g transform="translate(630, 245)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="290" height="165" rx="16" fill="url(#chmRed2)" />
      <!-- Crossed Tools Icon -->
      <path d="M 26 28 L 38 40 M 38 28 L 26 40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <text x="68" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">On Maintenance</text>
      <text x="24" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff">1</text>
    </g>

    <!-- ROW 3 -->
    <!-- Card 7: Today Pickup (Blue) -->
    <g transform="translate(0, 430)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="445" height="110" rx="16" fill="url(#chmBlue)" />
      <rect x="24" y="24" width="24" height="22" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
      <line x1="24" y1="30" x2="48" y2="30" stroke="#ffffff" stroke-width="2" />
      <text x="64" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Today Pickup</text>
    </g>

    <!-- Card 8: Today Return (Green) -->
    <g transform="translate(475, 430)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="445" height="110" rx="16" fill="url(#chmGreen)" />
      <path d="M 38 24 C 30 24, 24 30, 24 38 M 24 38 L 20 32 M 24 38 L 30 34" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="64" y="41" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Today Return</text>
    </g>
  </g>
</svg>
